name: notify discord

on: push # apply this to every branch

jobs:
  post-message:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '# discord-notify: no-run')"
    steps:
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: install dependencies
        run: pip install httpx

      - name: notify
        env:
          ACTOR: ${{ github.actor }} 
          REPO_FULL: ${{ github.repository }} 
          BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }} 
        run: |
          from httpx import HTTPStatusError
          import httpx
          import json
          import os

          # get our env vars first
          repository = os.environ.get("REPO_FULL")
          webhook = os.environ.get("WEBHOOK_URL")
          actor = os.environ.get("ACTOR")
          branch = os.environ.get("BRANCH")
          event_path = os.environ.get("GITHUB_EVENT_PATH")

          # own variables
          commits_list: list[dict[str, str]] = []

          if event_path and os.path.exists(event_path):
            with open(event_path, "r", encoding='utf-8') as f:
              event_data = json.load(f)

              commits = event_data.get("commits", [])
              for commit in commits:
                commits_list.append({
                  "sha": commit["id"],
                  "message": commit["message"],
                  "username": commit["author"]["username"]
                })

          # do the stuff
          commits_list.reverse() # latest commit is at the top
          commit_count = len(commits_list)
          short_shas = []
          sha_links = []
          usernames = []
          msg_header = []
          msg_desc = []
          
          for data in commits_list:
            short_shas.append(data["sha"][:7])
            sha_links.append(f"https://github.com/{repository}/commits/{data["sha"]}")
            usernames.append(data["username"])
            
            parts = data["message"].split("\n", maxsplit=1)
            header = parts[0]
            description = parts[1][:90] + "..." if len(parts) > 1 else ""
            msg_header.append(header)
            msg_desc.append(description)
          
          messages: list[str] = []
          for sha, author, commit_link, heading, desc in zip(short_shas, usernames, sha_links, msg_header, msg_desc):
            messages.append(f"- [`[{sha}]`]({commit_link}) - {heading} | @{author}\n  - {desc}")

          embed_header = f"<:github:1535885661683589161> │ GitHub Workflows/Actions\n# [[{repository} - {branch}] {commit_count} new {'commits' if commit_count > 1 else "commit"}](https://github.com/{repository}/tree/{branch})"

          payload = {
            "username": "GitHub",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "tts": False,
            "flags": 32768,
            "allowed_mentions": {
              "parse": [],
              "users": [],
              "roles": [],
              "replied_user": false
            },
            "components": [
              {
                "type": 17,
                "spoiler": False,
                "components": [
                  {
                    "type": 10,
                    "content": embed_header
                  },
                  {
                    "type": 14,
                    "divider": True,
                    "spacing": 1
                  },
                  {
                    "type": 10,
                    "content": "\n".join(messages)
                  },
                  {
                    "type": 14,
                    "divider": True,
                    "spacing": 1
                  },
                  {
                    "type": 10,
                    "content": "-# <a:blasieuwu:1566439835013480579> [@blasieuwu](https://blasieuwu.neocities.org) (creator) - not affiliated with GitHub"
                  }
                ]
              }
            ]
          }

          res = httpx.post(f"{webhook}?with_components=true", json=payload)

          if res.status_code not in (200, 204):
            raise HTTPStatusError(f"discord webhook failed to send with error {res.status_code}", response=res, request=res.request)
          # <end of file>
